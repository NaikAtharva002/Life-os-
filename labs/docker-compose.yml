services:
  # 1. Python AI & Analytics Engine with SQLite Relational Storage
  ai-engine:
    build:
      context: ./services/ai_engine
      dockerfile: Dockerfile
    container_name: life-os-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./services/ai_engine/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - life-os-network

  # 2. Local Web Client (Vite Dev / Containerized Preview)
  frontend:
    image: node:20-alpine
    container_name: life-os-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_AI_ENGINE_URL=http://localhost:8000
    depends_on:
      ai-engine:
        condition: service_healthy
    networks:
      - life-os-network

networks:
  life-os-network:
    driver: bridge
