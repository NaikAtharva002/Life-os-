name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Capacitor Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21 (Required by Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android 36 SDK & Build Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR" 2>/dev/null || true
          if [ ! -w "$SDK_DIR" ]; then
            sudo chown -R "$(whoami)":"$(id -gn)" "$SDK_DIR" || SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_DIR; downloading cmdline-tools..."
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            cp -r /tmp/cmdline-unpack/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$SDK_DIR" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Build Vite bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon > /tmp/gradle-build.log 2>&1
          STATUS=$?
          cat /tmp/gradle-build.log
          if [ $STATUS -ne 0 ]; then
            tail -n 20 /tmp/gradle-build.log | while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error::$line"
              fi
            done
            exit $STATUS
          fi

      - name: Verify APK output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
