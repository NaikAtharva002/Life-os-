name: Build Android APK

on:
  push:
    branches: [ main, develop, feature/atharva-foundation ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Capacitor Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21 (Required by Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Platform 36
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK Platform & Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite bundle & sync Capacitor Android
        run: npm run cap:sync

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
