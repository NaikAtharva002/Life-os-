name: LIFE OS Multi-Technology CI Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: TypeScript Lint, Build & Vitest Test Suite
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Quality (ESLint / TypeScript / Vite / Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint Static Check
        run: npm run lint

      - name: TypeScript Compile & Vite Production Build
        run: npm run build

      - name: Run Unit & Integration Tests
        run: npx vitest run --pool=threads --maxWorkers=1 --no-isolate

  # -------------------------------------------------------------
  # Job 2: Python AI Engine Prototype Tests (labs/)
  # -------------------------------------------------------------
  python-ai-engine-tests:
    name: Labs Python AI Engine (FastAPI / Pydantic / Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: labs/ai_engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SQL Migrations
        working-directory: labs/ai_engine
        run: |
          python database/migrator.py

      - name: Execute Pytest Suite
        working-directory: labs/ai_engine
        run: |
          pytest -v

  # -------------------------------------------------------------
  # Job 3: Rust & Tauri Prototype Check (labs/)
  # -------------------------------------------------------------
  rust-tauri-check:
    name: Labs Rust Desktop Shell (Tauri 2 / Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo Syntax & Dependency Check
        working-directory: labs/src-tauri
        run: |
          cargo check --verbose

  # -------------------------------------------------------------
  # Job 4: Containerization & Docker Image Build Verification
  # -------------------------------------------------------------
  docker-build-verification:
    name: Labs Docker Container Build (Multi-Stage Image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python AI Engine Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./labs/ai_engine
          push: false
          tags: life-os-ai-engine:latest
