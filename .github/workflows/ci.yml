name: LIFE OS Multi-Technology CI Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: TypeScript Frontend Validation & Production Build
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build (TypeScript / Vite / React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compile & Vite Production Build
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Python AI Engine & Relational SQLite Tests
  # -------------------------------------------------------------
  python-ai-engine-tests:
    name: Python AI Engine (FastAPI / Pydantic / Pytest / SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: services/ai_engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SQL Migrations
        working-directory: services/ai_engine
        run: |
          python database/migrator.py

      - name: Execute Pytest Suite
        working-directory: services/ai_engine
        run: |
          pytest -v

  # -------------------------------------------------------------
  # Job 3: Rust & Tauri Native Desktop Crate Check
  # -------------------------------------------------------------
  rust-tauri-check:
    name: Rust Native Desktop Shell (Tauri 2 / Cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo Syntax & Dependency Check
        working-directory: src-tauri
        run: |
          cargo check --verbose

  # -------------------------------------------------------------
  # Job 4: Containerization & Docker Image Build Verification
  # -------------------------------------------------------------
  docker-build-verification:
    name: Docker Container Build (Multi-Stage Image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python AI Engine Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai_engine
          push: false
          tags: life-os-ai-engine:latest
